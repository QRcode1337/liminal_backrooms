[tool.poetry]
name = "liminal-backrooms"
version = "0.8.0"
description = "AI-to-AI conversation system with branching capabilities"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10.0,<3.12"
requests = "^2.32.3"
replicate = "^1.0.7"
python-dotenv = "^1.0.0"
Pillow = "^10.2.0"
PyQt6 = "^6.6.1"
networkx = "^3.2.1"
anthropic = "^0.18.1"
openai = "^1.12.0"
beautifulsoup4 = "^4.12.3"

[tool.pyright]
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
